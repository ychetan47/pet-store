server:
  port: ${PORT:8083}
  shutdown: graceful

spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${ORDER_DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/petstore_order_db}}
    username: ${ORDER_DB_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${ORDER_DB_PASSWORD:${DATABASE_PASSWORD:postgrespassword}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

app:
  kafka:
    topics:
      order-events: order.events
      inventory-events: inventory.events
      dlt: order.events.DLT

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1qd3Qtc2VjcmV0LWZvci1wZXQtc3RvcmUtdjEtZGV2ZWxvcG1lbnQtdGVzdC1rZXk=}

services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

resilience4j:
  circuitbreaker:
    instances:
      catalogService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.RestClientException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - com.petstore.order.exception.ResourceNotFoundException
          - com.petstore.order.exception.BadRequestException
          - com.petstore.order.exception.InsufficientStockException
  retry:
    instances:
      catalogService:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
        ignore-exceptions:
          - com.petstore.order.exception.ResourceNotFoundException
          - com.petstore.order.exception.BadRequestException
          - com.petstore.order.exception.InsufficientStockException
  bulkhead:
    instances:
      catalogService:
        max-concurrent-calls: 10
        max-wait-duration: 100ms
  timelimiter:
    instances:
      catalogService:
        timeout-duration: 3s
        cancel-running-future: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
