server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: pet-store-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/petstoredb}
    username: ${DATABASE_USERNAME:chetan}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1qd3Qtc2VjcmV0LWZvci1wZXQtc3RvcmUtdjEtZGV2ZWxvcG1lbnQtdGVzdC1rZXk=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    provider: ${STORAGE_PROVIDER:gcs}
    bucket-name: ${GCS_BUCKET:pet-store-bucket}
    base-url: ${STORAGE_BASE_URL:https://storage.googleapis.com/pet-store-bucket}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
