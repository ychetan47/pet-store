apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-frontend
  namespace: petstore
  labels:
    app: customer-frontend
    app.kubernetes.io/part-of: petstore-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-frontend
  template:
    metadata:
      labels:
        app: customer-frontend
    spec:
      containers:
        - name: customer-frontend
          image: us-central1-docker.pkg.dev/petstore-app-1788943786/petstore-repo/customer-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: customer-frontend
  namespace: petstore
  labels:
    app: customer-frontend
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: customer-frontend
