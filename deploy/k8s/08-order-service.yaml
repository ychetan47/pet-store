apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: petstore
  labels:
    app: order-service
    app.kubernetes.io/part-of: petstore-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: us-central1-docker.pkg.dev/petstore-app-1788943786/petstore-repo/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: PORT
              value: "8083"
            - name: ORDER_DB_URL
              value: "jdbc:postgresql://postgres:5432/petstore_order_db"
            - name: ORDER_DB_USERNAME
              value: "postgres"
            - name: ORDER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: petstore-secrets
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: petstore-secrets
                  key: jwt-secret
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:8082"
            - name: USER_SERVICE_URL
              value: "http://user-service:8081"
            - name: OTEL_SDK_DISABLED
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: petstore
  labels:
    app: order-service
spec:
  ports:
    - port: 8083
      targetPort: 8083
      name: http
  selector:
    app: order-service
