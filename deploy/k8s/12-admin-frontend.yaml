apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
  namespace: petstore
  labels:
    app: admin-frontend
    app.kubernetes.io/part-of: petstore-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-frontend
  template:
    metadata:
      labels:
        app: admin-frontend
    spec:
      containers:
        - name: admin-frontend
          image: us-central1-docker.pkg.dev/petstore-app-1788943786/petstore-repo/admin-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: admin-frontend
  namespace: petstore
  labels:
    app: admin-frontend
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: admin-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: admin-frontend-public
  namespace: petstore
  labels:
    app: admin-frontend
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: admin-frontend
